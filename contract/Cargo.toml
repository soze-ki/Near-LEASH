[package]
name = "guardrail"
version = "0.1.0"
edition = "2021"
description = "On-chain policy gate for AI-agent spending via NEAR Chain Signatures and NEAR Intents (1Click)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
hex = "0.4"
omni-transaction = { version = "0.5", default-features = false, features = ["evm"] }

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
ed25519-dalek = "2"
sha2 = "0.10"
near-workspaces = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
chrono = "0.4"

[features]
default = []
